<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diario Ciclista</title>
    <meta name="theme-color" content="#0f172a"/>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="icon-192.png" type="image/png">
    <style>
      /* Simple scrollbar styling for a more modern look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; /* slate-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; /* slate-700 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; /* slate-600 */
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); /* amber-500 */
        }
        70% {
          transform: scale(1.05);
          box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
        }
      }
      .animate-pulse-install {
        animation: pulse 2s infinite;
      }
    </style>
    <script>
      // Captura el evento que indica que la app se puede instalar.
      // Esto se hace aquí para evitar condiciones de carrera con la carga de React.
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Previene que aparezca la mini-barra de información en el móvil.
        e.preventDefault();
        // Guarda el evento para que pueda ser disparado más tarde.
        window.deferredPrompt = e;
        // Notifica a la app que el botón de instalación puede mostrarse.
        window.dispatchEvent(new CustomEvent('pwa-installable'));
        console.log('`beforeinstallprompt` event was fired and captured.');
      });
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
</head>
  <body class="bg-slate-900 text-slate-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
